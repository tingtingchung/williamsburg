# Rachel's Guide to Williamsburg, VA — the data behind README.md
#
# Each place lists the sections it belongs to under `tags`.
# A place can belong to as many sections as you like.
# After editing, run:  python3 build.py
#
# Fields:
#   name     (required) display name
#   url      (optional) official site or best reference page
#   map      (optional) search text for a Google Maps link; defaults to name
#   area     (optional) town / neighborhood
#   tags     (required) list of section keys (see `sections` below)
#   notes    (required) Rachel's notes; list of bullet strings
#   tip      (optional) a personal "tell them I sent you" tip

sections:
  - key: must-see
    title: "⭐ Must-See"
    intro: "If you only have a couple of days, start here."
  - key: history-williamsburg
    title: "🏛️ History in Williamsburg"
    intro: "Colonial Williamsburg and the William & Mary campus, all within walking distance."
  - key: history-30
    title: "🏛️ History within 30 minutes"
    intro: "Jamestown and Yorktown, which with Williamsburg make up Virginia's Historic Triangle."
  - key: history-2h
    title: "🏛️ History within 2 hours"
    intro: "Worth a day trip, or a stop on the drive to or from DC. Drive times are approximate, from Williamsburg."
  - key: music
    title: "🎶 Music"
    intro: "Free music in historic places."
  - key: restaurants
    title: "🍽️ Restaurants"
    intro: "My favorite places to eat, from fancy to family-style."
  - key: romantic
    title: "🕯️ Romantic & Fancy"
    intro: "For a special dinner or a fancy stay."
  - key: seafood
    title: "🦪 Seafood & Oysters"
    intro: "Virginia has the best oysters and crabs, and cold weather is the best time to eat oysters!"
  - key: shopping
    title: "🛍️ Shops & Groceries"
    intro: "Where to pick up local treats, imported goodies and souvenirs."
  - key: coffee
    title: "☕ Coffee"
    intro: ""
  - key: beaches
    title: "🏖️ Beaches & Outdoors"
    intro: ""
  - key: boats
    title: "⛵ Boats & Ferries"
    intro: ""
  - key: kids
    title: "🎢 Family Fun"
    intro: "Kid-approved (Connor-approved!) things to do."
  - key: holiday
    title: "🎄 Holiday & Winter"
    intro: "Good to know if you're visiting in the cold months."
  - key: day-trips
    title: "🚗 Day Trips"
    intro: "Easy drives from Williamsburg."
  - key: road-trip
    title: "🛣️ On the Way (DC ↔ Williamsburg)"
    intro: "Worth a stop on the drive down or back."

places:
  # ---------- Williamsburg ----------
  - name: Merchants Square
    url: https://www.merchantssquare.org/
    map: Merchants Square Williamsburg VA
    area: Downtown Williamsburg
    tags: [must-see, shopping, restaurants]
    notes:
      - Adorable, with elegant shops and cafes. Many of the fancy restaurants are here. You have to visit at least once!
      - The square is blocked off for the Farmers Market 9am–12pm on Saturdays.

  - name: Williamsburg Farmers Market
    url: https://www.williamsburgfarmersmarket.com/
    map: Williamsburg Farmers Market Merchants Square
    area: Merchants Square, near the Wren Building
    tags: [shopping, must-see, holiday]
    notes:
      - Every Saturday morning, 9am–12pm, at Merchants Square, just outside the Wren Building end of campus.
      - Check the winter schedule online before you go.

  - name: William & Mary campus
    url: https://www.wm.edu/
    map: College of William & Mary Williamsburg VA
    area: Williamsburg
    tags: [must-see, history-williamsburg]
    notes:
      - The campus is beautiful. You should definitely walk around for a visit.

  - name: Sir Christopher Wren Building
    url: https://www.colonialwilliamsburg.org/locations/wren-building/
    map: Wren Building William & Mary
    area: William & Mary
    tags: [must-see, history-williamsburg, music]
    notes:
      - The oldest academic building still in use in the USA, so you should go see it.
      - Free organ concert in the Wren Chapel every Saturday at 10am (about 30 minutes).
      - The Saturday Farmers Market is right outside.

  - name: Saturday organ recital in the Wren Chapel
    url: https://www.wm.edu/sites/historiccampus/visiting/organrecitals/
    map: Wren Chapel William & Mary
    area: William & Mary
    tags: [music, history-williamsburg]
    notes:
      - Free, every Saturday at 10am, played on an 18th-century English chamber organ.
      - A perfect pair with the Farmers Market (9am–12pm), before or after the recital.

  - name: Mason School of Business
    url: https://mason.wm.edu/
    map: Alan B. Miller Hall Mason School of Business Williamsburg
    area: William & Mary
    tags: [must-see]
    notes:
      - The fanciest building on campus and definitely worth a visit.
      - Walk behind the building to reach the lake and the amphitheatre by the lake.

  - name: Colonial Williamsburg
    url: https://www.colonialwilliamsburg.org/
    map: Colonial Williamsburg Visitor Center
    area: Williamsburg
    tags: [must-see, history-williamsburg, kids, holiday]
    notes:
      - Schedule one whole day for Colonial Williamsburg. It's a must-see!

  - name: King's Arms Tavern
    url: https://www.colonialwilliamsburg.org/stay-play/dining/historic-taverns/kings-arms-tavern/
    map: King's Arms Tavern Williamsburg VA
    area: Colonial Williamsburg
    tags: [restaurants, history-williamsburg]
    notes:
      - A colonial-themed restaurant with servers in period dress, right in the Historic Area.

  - name: Williamsburg Inn
    url: https://www.colonialwilliamsburg.org/stay-play/accommodations/
    map: Williamsburg Inn
    area: Colonial Williamsburg
    tags: [romantic, history-williamsburg]
    notes:
      - Very fancy. Queen Elizabeth II stayed here on both of her visits to Williamsburg.

  - name: Williamsburg Lodge
    url: https://www.marriott.com/en-us/hotels/phfak-williamsburg-lodge-autograph-collection/overview/
    map: Williamsburg Lodge Autograph Collection
    area: Colonial Williamsburg
    tags: [romantic]
    notes:
      - Also very fancy, and a short walk to the Historic Area, campus and Merchants Square.

  - name: Le Yaca
    url: https://www.opentable.com/r/le-yaca-williamsburg
    map: Le Yaca 1430 High Street Williamsburg VA
    area: High Street, Williamsburg
    tags: [restaurants, romantic]
    notes:
      - French. One of my two picks for a romantic dinner.

  - name: Fat Canary
    url: https://www.merchantssquare.org/merchant/fat-canary/
    map: Fat Canary Williamsburg VA
    area: Merchants Square
    tags: [restaurants, romantic]
    notes:
      - My other pick for a romantic dinner. Reservations are highly recommended.

  - name: Sal's by Victor
    url: https://www.virginia.org/listing/sals-by-victor-italian-restaurant-%26-pizzeria/881/
    map: Sal's by Victor 1242 Richmond Rd Williamsburg VA
    area: Richmond Road, Williamsburg
    tags: [restaurants, shopping, must-see]
    notes:
      - The best Italian restaurant, run by my former student Nicola's wife, Mirella.
      - They also sell Italian olive oil, wine and cakes, all flown in directly from Italy, because the whole family is 100% Italian!
      - They make their own pasta, and their Sicilian pizza is the best!
    tip: Tell them you are my student and they will take good care of you 😉

  - name: Kephi Greek Kitchen
    url: https://kephigreek.kitchen/
    map: Kephi Greek Kitchen Williamsburg VA
    area: Williamsburg
    tags: [restaurants, seafood, shopping]
    notes:
      - My favorite Greek restaurant.
      - They have grilled whole fish, and their lamb shank pasta is the most amazing I've ever had!
      - There's a grocery section where you can buy Greek olive oil and sauces.

  - name: Casa Pearl
    url: https://www.eatcasapearl.com/
    map: Casa Pearl 722 Merrimac Trail Williamsburg VA
    area: Merrimac Trail, Williamsburg
    tags: [restaurants, seafood]
    notes:
      - The best seafood restaurant. Oysters and tacos!
      - Their grilled whole fish is my favorite.

  - name: Fat Tuna Grill & Oyster House
    url: http://www.fattunagrill.com/
    map: Fat Tuna Grill and Oyster House 1433 Richmond Rd Williamsburg VA
    area: Richmond Road, Williamsburg
    tags: [restaurants, seafood]
    notes:
      - A casual, family-friendly local oyster bar and grill with lots of fresh seafood.

  - name: Ichiban
    url: http://ichibannewtown.com/
    map: Ichiban 4905 Courthouse St Williamsburg VA
    area: New Town
    tags: [restaurants]
    notes:
      - My favorite Chinese restaurant in town.
      - It's in New Town, which is very nice to walk around when the weather is nice.

  - name: New Town
    url: https://www.newtownwilliamsburg.com/
    map: New Town Williamsburg VA
    area: Williamsburg
    tags: [shopping, restaurants]
    notes:
      - A very nice area to walk around (when the weather is nice), with shops, restaurants and a movie theater.

  - name: Carino's Seafood
    map: Carino's Seafood 4391 Ironbound Rd Williamsburg VA
    area: Ironbound Road, Williamsburg
    tags: [seafood, shopping]
    notes:
      - My favorite seafood grocery store.
      - Buy fresh oysters from Jeff Carino. Now, in cold weather, is the best time to eat oysters!
    tip: Tell Jeff I say hi!

  - name: The Coffeehouse
    map: The Coffeehouse 5251 John Tyler Hwy Williamsburg VA
    area: Between Jamestown and Colonial Williamsburg
    tags: [coffee]
    notes:
      - My favorite coffee place. A family-owned roaster.

  - name: Anonymous Coffee
    map: Anonymous Coffee 4808 Courthouse St Williamsburg VA
    area: New Town
    tags: [coffee]
    notes:
      - A cozy, lounge-style coffee shop with European-style coffees and signature drinks, whose mission is to support mental health.
      - It moved to New Town in late 2025, so it's easy to pair with a walk around New Town.

  - name: illy Caffè
    url: https://merchantssquare.org/merchant/illy-cafe
    map: illy Caffe 435 W Duke of Gloucester St Williamsburg VA
    area: Merchants Square
    tags: [coffee]
    notes:
      - A European-style café in Merchants Square serving illy coffee, breakfast and lunch, with aperitivo, cocktails and wine later in the day.
      - Grab a coffee here before or after the Saturday Farmers Market.

  - name: Hohl
    map: Hohl 219 N Boundary St Williamsburg VA
    area: N. Boundary St near Colonial Williamsburg (also in Toano)
    tags: [coffee, restaurants]
    notes:
      - A café in a house, with specialty coffee and pastries, breakfast, brunch and lunch made from scratch.
      - A short walk from Colonial Williamsburg and campus. The original shop is in Toano, west of town.

  - name: The Peanut Shop of Williamsburg
    url: https://www.merchantssquare.org/merchant/the-peanut-shop-of-williamsburg/
    map: The Peanut Shop of Williamsburg Merchants Square
    area: Merchants Square
    tags: [shopping]
    notes:
      - Virginia's specialty is peanuts! Stop by to get local peanuts (lots of free samples).

  - name: Williamsburg Premium Outlets
    url: https://www.premiumoutlets.com/outlet/williamsburg
    map: Williamsburg Premium Outlets
    area: Williamsburg
    tags: [shopping]
    notes:
      - Tourists love this outlet mall.

  - name: Busch Gardens Williamsburg
    url: https://buschgardens.com/williamsburg/
    map: Busch Gardens Williamsburg
    area: Williamsburg
    tags: [kids, holiday]
    notes:
      - It will be decorated for Christmas!

  - name: Williamsburg Christmas Market
    url: https://marketspread.com/market/32365/williamsburg-christmas-market/
    map: Bicentennial Park 320 W Court St Williamsburg VA
    area: Court Street at Bicentennial Park, behind the Art Museums of Colonial Williamsburg
    tags: [holiday, shopping, kids]
    notes:
      - A European-style Christmas village with about 40 vendor chalets, Santa photos, a train ride, a petting zoo, fire pits, live music, glühwein (warm spiced wine) and market food.
      - "2026 dates: Nov 27–29, Dec 3–6, Dec 10–13 and Dec 17–20. Hours: Thu 11am–6pm, Fri 11am–7pm, Sat 10am–7pm, Sun 11am–6pm."
      - Free on Thursdays; a one-time $5 fee Friday–Sunday covers return visits. Free for 18 and under and students with ID.

  - name: The Wagsters Magic Theatre
    url: https://www.williamsburgmagic.com/
    map: The Wagsters Magic Theatre 1430 High St Williamsburg VA
    area: High Street, Williamsburg
    tags: [kids, holiday]
    notes:
      - A family-friendly magic show by husband-and-wife magicians Brandon and Hannah Wagster, in Virginia's only theatre dedicated just to magic.
      - Big Vegas-style illusions and escapes up close in an intimate theatre. Around the holidays they put on a special Christmas show (check the website for dates).

  - name: Berkeley Plantation
    url: https://www.berkeleyplantation.com/
    map: Berkeley Plantation Charles City VA
    area: Charles City, on the James River (about 40 minutes)
    tags: [holiday, history-2h, day-trips]
    notes:
      - Did you know that the first Thanksgiving in America took place at Berkeley Plantation? Settlers landed here on December 4, 1619, two years before the Pilgrims' feast at Plymouth, and held a thanksgiving to celebrate their safe arrival.
      - The Virginia Thanksgiving Festival has been celebrated here since 1958.

  # ---------- Jamestown & Surry ----------
  - name: Jamestown
    url: https://historicjamestowne.org/
    map: Historic Jamestowne
    area: Jamestown (about 15 minutes)
    tags: [history-30, beaches, boats, kids]
    notes:
      - Visit for the beach, historical tours and sailboat trips.
      - Jamestown Settlement (the living-history museum) is next door; see below.

  - name: Jamestown Settlement
    url: https://www.jyfmuseums.org/visit/jamestown-settlement
    map: Jamestown Settlement
    area: Jamestown (about 15 minutes)
    tags: [history-30, kids]
    notes:
      - Living-history museum with replica ships, a Powhatan village and a fort.

  - name: Pocahontas statue
    url: https://historicjamestowne.org/visit/plan-your-visit/monuments-pocahontas/
    map: Pocahontas statue Historic Jamestowne
    area: Historic Jamestowne, Jamestown Island (about 15 minutes)
    tags: [history-30]
    notes:
      - This area is Pocahontas country! Her bronze statue (1922) stands at Historic Jamestowne on Jamestown Island.

  - name: Jamestown–Scotland Ferry
    url: https://www.virginiadot.org/travel/ferry-jamestown.asp
    map: Jamestown Scotland Ferry
    area: Jamestown to Surry
    tags: [boats, day-trips, kids]
    notes:
      - Take the free ferry across the James River to Surry and have lunch at Surry Seafood.
      - On the other side, spend time at the beach at Chippokes State Park, or drive on to Smithfield for its famous ham.

  - name: The Surry Seafood Co.
    url: https://www.opentable.com/r/the-surry-seafood-co-surry
    map: The Surry Seafood Co 633 Marina Dr Surry VA
    area: Surry (across the James River)
    tags: [restaurants, seafood, day-trips]
    notes:
      - Waterfront lunch after the free Jamestown ferry ride.

  - name: Chippokes State Park
    url: https://www.dcr.virginia.gov/state-parks/chippokes
    map: Chippokes State Park 695 Chippokes Park Rd Surry VA
    area: Surry, about 10 minutes from the Jamestown ferry landing
    tags: [beaches, day-trips, kids, history-2h]
    notes:
      - A state park with a sandy beach on the James River, just across from Jamestown. Take the free ferry over!
      - Hunt for fossils on the beach (you can keep shark teeth). It's also one of the oldest continually farmed plantations in the country, farmed since 1619.

  - name: Smithfield
    url: https://smithfieldva.gov/297/Visitors
    map: Historic Downtown Smithfield VA
    area: Isle of Wight County, across the James River (via the ferry or the James River Bridge)
    tags: [day-trips, history-2h, shopping, restaurants]
    notes:
      - Home of the famous Smithfield ham! It's known as the "Ham Capital of the World."
      - A charming historic river town with a walkable downtown, colorful pig statues to find around town, and restaurants serving Smithfield ham.
      - The Isle of Wight County Museum on Main Street is home to the world's oldest ham.

  # ---------- Yorktown ----------
  - name: Yorktown
    url: https://www.visityorktown.org/
    map: Yorktown Beach Yorktown VA
    area: Yorktown (about 20 minutes)
    tags: [history-30, beaches, day-trips]
    notes:
      - Visit for the beach, sailboat tours and sushi on the beach at Umi.

  - name: Yorktown Sailing Charters
    url: https://www.sailyorktown.com/
    map: Yorktown Sailing Charters 425 Water St Yorktown VA
    area: Riverwalk Landing, Yorktown
    tags: [boats, romantic]
    notes:
      - Schooner cruises on the York River, including sunset sails (seasonal, roughly April–November).

  - name: Umi Sushi
    map: Umi Sushi 327 Water St Yorktown VA
    area: Yorktown waterfront
    tags: [restaurants, seafood, beaches]
    notes:
      - Sushi on the beach!

  # ---------- Hampton, Newport News, Norfolk ----------
  - name: Fort Monroe National Monument
    url: https://www.nps.gov/fomr/
    map: Fort Monroe National Monument
    area: Hampton (about 40 minutes)
    tags: [history-2h, beaches, day-trips]
    notes:
      - Beach plus historical sightseeing.

  - name: Virginia Air & Space Science Center
    url: https://vasc.org/
    map: Virginia Air and Space Science Center Hampton VA
    area: Hampton (about 36 minutes away)
    tags: [kids, day-trips]
    notes:
      - Part of NASA Langley, a little past Newport News.
      - Aircraft and spacecraft exhibits, an IMAX theater, and interactive exhibits for kids and adults.

  - name: Korean restaurants & groceries in Newport News
    map: Korean restaurants Newport News VA
    area: Newport News
    tags: [restaurants, shopping, day-trips]
    notes:
      - Newport News has some very authentic Korean restaurants and grocery stores.

  - name: Hayashi Sushi & Grill
    url: https://www.newport-news.org/visitors/where-to-dine/74/hayashi-sushi-and-grill
    map: Hayashi Sushi & Grill 11820 Merchants Walk Newport News VA
    area: City Center, Newport News
    tags: [restaurants, seafood]
    notes:
      - Run by my friend Jay.
    tip: Tell him you are my student and ask him to give you the best seafood!

  - name: Norfolk & Naval Station Norfolk
    url: https://www.visitnorfolk.com/
    map: Naval Station Norfolk
    area: Norfolk (about 40 minutes away)
    tags: [day-trips, kids, boats]
    notes:
      - The biggest naval base in the world. A great place to see destroyers and other giant ships.

  # ---------- Virginia Beach & beyond ----------
  - name: Virginia Beach
    url: https://www.visitvirginiabeach.com/
    map: Virginia Beach Boardwalk
    area: About 1 hour 15 minutes away
    tags: [beaches, day-trips]
    notes:
      - From here it's about another hour to the Outer Banks.

  - name: The Adventure Park at Virginia Aquarium
    url: https://myadventurepark.com/location/virginia-beach-va/
    map: The Adventure Park at Virginia Aquarium
    area: Virginia Beach
    tags: [kids, beaches, day-trips]
    notes:
      - Connor's favorite ropes course! Treetop trails and ziplines next to the aquarium.

  - name: First Landing State Park
    url: https://www.dcr.virginia.gov/state-parks/first-landing
    map: First Landing State Park
    area: Virginia Beach (about 1 hour 10 minutes)
    tags: [beaches, history-2h, day-trips]
    notes:
      - Has a beach and is close to Virginia Beach.

  - name: Outer Banks
    url: https://www.outerbanks.org/
    map: Outer Banks NC
    area: North Carolina (about 1 hour past Virginia Beach)
    tags: [beaches, day-trips]
    notes:
      - Keep going from Virginia Beach for another hour.

  # ---------- On the way ----------
  - name: Skyline Drive
    url: https://www.nps.gov/shen/planyourvisit/driving-skyline-drive.htm
    map: Skyline Drive Shenandoah National Park
    area: Shenandoah National Park
    tags: [road-trip, beaches]
    notes:
      - Try to take Skyline Drive to or from Williamsburg.
      - A 105-mile scenic road running north–south along the crest of the Blue Ridge Mountains through Shenandoah National Park.

  - name: Luray Caverns
    url: https://luraycaverns.com/
    map: Luray Caverns
    area: Luray, near Skyline Drive
    tags: [road-trip, kids]
    notes:
      - The largest cavern system in the eastern United States.

  - name: Charlottesville
    url: https://www.visitcharlottesville.org/
    map: Charlottesville VA
    area: On the way from DC (about 2 hours)
    tags: [road-trip, history-2h]
    notes:
      - Stop for more historical sites.

  - name: Fredericksburg
    url: https://www.visitfred.com/
    map: Fredericksburg VA
    area: On the way from DC (about 1 hour 45 minutes)
    tags: [road-trip, history-2h]
    notes:
      - Stop for more historical sites.

  - name: Hagerstown, MD
    map: Hagerstown MD
    area: Maryland
    tags: [road-trip]
    notes:
      - So glad you stopped by Hagerstown as well! That restaurant looks amazing!
